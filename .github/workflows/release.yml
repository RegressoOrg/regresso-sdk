name: Release

# Publishes to npm when `pnpm release` pushes a vX.Y.Z tag, using npm trusted publishing (OIDC), so no npm
# token is stored. Each package's trusted publisher on npmjs.com names this workflow file, so renaming it
# breaks publishing. Provenance can only be generated from CI, which is why this doesn't run locally.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    # Never from forks.
    if: github.repository == 'RegressoOrg/regresso-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later, newer than the npm that ships with Node 22.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./packages/browser/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm build
      - run: pnpm test
      - run: pnpm pack:test
      - run: pnpm publish-packages
        env:
          NPM_CONFIG_PROVENANCE: "true"
