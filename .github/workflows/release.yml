name: Release

# Publishes to npm when `pnpm release` pushes a vX.Y.Z tag. Publishing happens here rather than locally
# because npm provenance can only be generated from CI.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  release:
    # Never from forks.
    if: github.repository == 'RegressoOrg/regresso-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./packages/browser/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm build
      - run: pnpm test
      - run: pnpm pack:test
      - run: pnpm publish-packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
