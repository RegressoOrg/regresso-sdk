name: Release

# Stages the packages on npm when `pnpm release` pushes a vX.Y.Z tag, using npm trusted publishing (OIDC), so no
# npm token is stored. Nothing goes live until a maintainer approves each staged package with 2FA. Each package's
# trusted publisher on npmjs.com names this workflow file, so renaming it breaks publishing.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    # Never from forks.
    if: github.repository == 'RegressoOrg/regresso-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./packages/browser/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm build
      - run: pnpm test
      - run: pnpm pack:test
      - run: pnpm stage publish -r --no-git-checks
